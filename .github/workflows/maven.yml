name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # Le numéro de release est aussi le tag v.<numéro> créé plus bas
      run: mvn -B package --file pom.xml -Dbuild.version=${{ github.run_number }}

    - run: mkdir artifact && cp target/*.jar artifact

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v.${{ github.run_number }}
        files: /home/runner/work/plugin/plugin/artifact/plugin-1.0-fat.jar
